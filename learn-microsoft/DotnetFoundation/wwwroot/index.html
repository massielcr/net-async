<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <button id="io-bound">I/O-bound</button>

    <button id="cpu-bound">CPU-bound</button>

    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const ioBoundButton = document.getElementById('io-bound');
            const cpuBoundButton = document.getElementById('cpu-bound');

            ioBoundButton.addEventListener('click', async () => {
                const response = await fetch('/api/iobound');
                const result = await response.text();
                alert(result);
            });

            cpuBoundButton.addEventListener('click', async () => {
                const response = await fetch('/api/cpubound');
                const result = await response.text();
                alert(result);
            });
        });
    </script>
</body>
</html>
