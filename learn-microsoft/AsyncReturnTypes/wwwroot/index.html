<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Async Return Types</title>
    <style>
        body {
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="display-4">Asynchronous Return Types</h1>

    <br />

    <button id="taskButton">Task</button>
    <button id="taskTResultButton">Task&lt;TResult&gt;</button>
    <button id="valueTaskButton">ValueTask&lt;TResult&gt;</button>
    <button id="streamsButton">Streams</button>

    <br /><br />

    <ul id="console-output" style="color: green; font-family: monospace; list-style-type: none"></ul>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/9.0.6/signalr.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const connection = new signalR.HubConnectionBuilder()
                .withUrl("/notificationHub")
                .build();

            connection.on("notify", (message) => {
                const li = document.createElement("li");
                li.textContent = `> ${message}`;
                document.getElementById("console-output").appendChild(li);
            });

            connection.start()
                .then(() => console.log("Connected to SignalR Hub"))
                .catch(err => console.error("SignalR Connection Error: ", err));

            const taskButton = document.getElementById('taskButton');
            const taskTResultButton = document.getElementById('taskTResultButton');
            const valueTaskButton = document.getElementById('valueTaskButton');
            const streamsButton = document.getElementById('streamsButton');

            taskButton.addEventListener('click', async () => {
                const consoleoutput = document.getElementById('console-output');
                consoleoutput.innerHTML = '';
                const response = await fetch('/api/task');
            });

            taskTResultButton.addEventListener('click', async () => {
                const consoleoutput = document.getElementById('console-output');
                consoleoutput.innerHTML = '';

                const response = await fetch('/api/tasktresult');
                if (response.ok) {
                    const data = await response.json();
                    const li = document.createElement("li");
                    li.textContent = `> Received: ${data}`;
                    consoleoutput.appendChild(li);
                } else {
                    const li = document.createElement("li");
                    li.textContent = `> Error: ${response.statusText}`;
                    consoleoutput.appendChild(li);
                }
            });

            valueTaskButton.addEventListener('click', async () => {
                const consoleoutput = document.getElementById('console-output');
                consoleoutput.innerHTML = '';

                const response = await fetch('/api/valuetask');
                if (response.ok) {
                    const data = await response.json();
                    const li = document.createElement("li");
                    li.textContent = `> Received: ${data}`;
                    consoleoutput.appendChild(li);
                } else {
                    const li = document.createElement("li");
                    li.textContent = `> Error: ${response.statusText}`;
                    consoleoutput.appendChild(li);
                }
            });

            streamsButton.addEventListener('click', async () => {
                const consoleoutput = document.getElementById('console-output');
                consoleoutput.innerHTML = '';
                const response = await fetch('/api/streams');
            });

        });

    </script>
</body>
</html>
